<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{max-width:800px;margin:0 auto;padding:2rem 1rem;font-family:system-ui, -apple-system, sans-serif;line-height:1.7;color:#333;background:#fff;}
        header{margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid #eee;}
        nav a{margin-right:1rem;text-decoration:none;color:#0066cc;}
        nav a:hover{text-decoration:underline;}
        footer{margin-top:3rem;padding-top:1rem;border-top:1px solid #eee;color:#666;font-size:0.9rem;}
        h1,h2,h3{margin:1.5rem 0 1rem;}
        p{margin-bottom:1rem;}
        img{max-width:100%;border-radius:4px;}
        ul,ol{padding-left:1.5rem;margin-bottom:1rem;}
        blockquote{border-left:4px solid #ccc;padding-left:1rem;color:#555;margin:1rem 0;}
        pre{background:#f6f8fa;padding:1rem;overflow-x:auto;border-radius:4px;margin:1rem 0;}
        code{background:#f6f8fa;padding:0 4px;border-radius:3px;}
    </style>
</head>
<body>
    <header>
        <h1><a href="{{ site.baseurl }}/" style="text-decoration:none;color:#222;">{{ site.title }}</a></h1>
        <nav>
        {% for page in site.header_pages %}
            <a href="{{ page.url | relative_url }}">{{ page.title }}</a>
        {% endfor %}
        </nav>
    </header>

    <main>
        {{ content }}
    </main>

    <footer>
        © {{ site.time | date: '%Y' }} {{ site.author }} | Powered by Jekyll & GitHub Pages
    </footer>
</body>
</html>
