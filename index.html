<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人博客</title>
    <style>
        /* 全局样式 */
        :root {
            --bg: #ffffff;
            --text: #222222;
            --card-bg: #f8f9fa;
            --border: #e5e7eb;
            --primary: #2563eb;
        }
        [data-theme="dark"] {
            --bg: #111827;
            --text: #f3f4f6;
            --card-bg: #1f2937;
            --border: #374151;
            --primary: #3b82f6;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 20px;
        }
        header {
            padding: 40px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .site-title a {
            font-size: 28px;
            font-weight: bold;
            color: var(--text);
            text-decoration: none;
        }
        nav a {
            color: var(--text);
            text-decoration: none;
            margin-left: 20px;
        }
        nav a:hover {
            color: var(--primary);
        }
        #theme-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            cursor: pointer;
        }
        main {
            padding: 40px 0;
        }
        .post-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .post-card h2 a {
            color: var(--text);
            text-decoration: none;
        }
        .post-card h2 a:hover {
            color: var(--primary);
        }
        .post-date {
            font-size: 14px;
            opacity: 0.7;
            margin: 6px 0 12px;
        }
        .read-more {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        footer {
            padding: 30px 0;
            text-align: center;
            border-top: 1px solid var(--border);
            opacity: 0.7;
            font-size: 14px;
        }
        /* 页面切换区块 */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="site-title">
                <a href="#home" onclick="switchPage('home')">我的个人博客</a>
            </div>
            <nav>
                <a href="#home" onclick="switchPage('home')">首页</a>
                <a href="#about" onclick="switchPage('about')">关于我</a>
                <button id="theme-btn">切换主题</button>
            </nav>
        </header>

        <main>
            <!-- 首页：文章列表 -->
            <div id="home" class="page active">
                <h1 style="margin-bottom:30px;">文章</h1>
                <div class="post-card">
                    <h2><a href="#">第一篇博客：搭建静态博客</a></h2>
                    <div class="post-date">2026-09-18</div>
                    <p>这是一篇示例文章，这个博客可以直接部署在 GitHub Pages，不需要服务器。纯静态网页，打开即可浏览。</p>
                    <br>
                    <a class="read-more" href="#">阅读全文 →</a>
                </div>
                <div class="post-card">
                    <h2><a href="#">Markdown 写作小技巧</a></h2>
                    <div class="post-date">2026-09-17</div>
                    <p>写博客常用的 Markdown 语法，标题、列表、代码块、引用，简单易学。</p>
                    <br>
                    <a class="read-more" href="#">阅读全文 →</a>
                </div>
            </div>

            <!-- 关于页面 -->
            <div id="about" class="page">
                <h1 style="margin-bottom:20px;">关于我</h1>
                <p>你好，欢迎来到我的博客。</p>
                <p style="margin-top:12px;">这里记录我的学习笔记、想法和生活随笔。</p>
                <p style="margin-top:12px;">Github：<a style="color:var(--primary)" href="https://github.com/你的用户名" target="_blank">github.com/你的用户名</a></p>
            </div>
        </main>

        <footer>
            <p>© 2026 我的个人博客 | Powered by GitHub Pages</p>
        </footer>
    </div>

    <script>
        // 页面切换
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }

        // 深色浅色主题切换
        const themeBtn = document.getElementById('theme-btn');
        const html = document.documentElement;
        // 读取本地存储主题
        if(localStorage.getItem('theme')) {
            html.setAttribute('data-theme', localStorage.getItem('theme'));
        }
        themeBtn.onclick = function() {
            if(html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                localStorage.setItem('theme','light');
            } else {
                html.setAttribute('data-theme','dark');
                localStorage.setItem('theme','dark');
            }
        }
    </script>
</body>
</html>
